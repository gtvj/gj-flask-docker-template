[tool.poetry]
name = "gj-flask-docker-template"
version = "0.1.0"
description = "Flask application template using Docker"
authors = ["G Jones"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.1.0"
gunicorn = "^26.0.0"
wtforms = "^3.2.2"
flask-wtf = "^1.3.0"
python-dotenv = "^1.2.2"
pyyaml = "^6.0.3"
python-statemachine = "^3.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.6.0"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".git", ".venv", "__pycache__"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]